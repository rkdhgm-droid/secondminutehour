<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강대한 | 방폭·전기 엔지니어 포트폴리오 & 자기소개서</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font: Noto Sans KR -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#0a0f1d',
              card: '#131b2e',
              border: '#1e293b',
              accent: '#38bdf8',
              emerald: '#10b981',
              amber: '#f59e0b',
              rose: '#ef4444',
            }
          },
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #070b14;
      color: #e2e8f0;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sky-500 selection:text-white">

  <!-- TOP HEADER / NAVIGATION -->
  <header class="sticky top-0 z-50 bg-[#0a0f1d]/90 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Brand & Name -->
        <div class="flex items-center space-x-3">
          <div class="relative group">
            <img src="images/profile-3d.png" alt="강대한 3D 아바타" class="w-11 h-11 rounded-xl object-cover object-top border border-sky-400/50 shadow-md">
            <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-emerald-500 rounded-full border-2 border-slate-900 flex items-center justify-center text-[8px] text-slate-950 font-bold">✓</div>
          </div>
          <div>
            <h1 class="text-lg font-bold text-white tracking-wide flex items-center gap-2">
              강대한 <span class="text-xs px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-400 font-normal border border-sky-500/30">방폭·전기 엔지니어</span>
            </h1>
            <p class="text-xs text-slate-400">인천폴리텍 하이테크 과정 | 전기기능사 · 전기공사산업기사 준비 및 PLC 제어전문</p>
          </div>
        </div>

        <!-- Desktop Navigation Tabs -->
        <nav class="hidden md:flex space-x-1">
          <button onclick="switchTab('projects')" id="nav-projects" class="nav-btn px-3 py-2 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-1.5 text-sky-400 bg-sky-500/10 border border-sky-500/30">
            <i class="fa-solid fa-layer-group"></i>
            <span>프로젝트 & 실습</span>
          </button>
          <button onclick="switchTab('cover-letter')" id="nav-cover-letter" class="nav-btn px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all duration-200 flex items-center gap-1.5">
            <i class="fa-regular fa-file-lines"></i>
            <span>자기소개서</span>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

    <!-- TAB 1: PROJECTS -->
    <section id="tab-projects" class="tab-content space-y-12">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-7 space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- PLC Model Image -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
              <div class="aspect-[3/4] bg-slate-950 rounded-xl overflow-hidden relative mb-2 border border-slate-800">
                <img src="images/plc-intersection-model.jpg" alt="PLC 교차로 디오라마 모형" class="w-full h-full object-cover">
              </div>
              <span class="font-bold text-sky-400 text-xs block mb-1">[상부] 4거리 도로 디오라마</span>
            </div>
            <!-- PLC Panel Image -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
              <div class="aspect-[3/4] bg-slate-950 rounded-xl overflow-hidden relative mb-2 border border-slate-800">
                <img src="images/plc-control-panel.jpg" alt="PLC 제어반 배선판" class="w-full h-full object-cover">
              </div>
              <span class="font-bold text-emerald-400 text-xs block mb-1">[하부] LS PLC 제어반 배선판</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Arduino Section Images -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
          <div class="aspect-[3/4] bg-slate-950 rounded-xl overflow-hidden relative mb-2 border border-slate-800">
            <img src="images/arduino-circuit-front.jpg" alt="아두이노 회로 전면" class="w-full h-full object-cover">
          </div>
          <span class="font-bold text-emerald-400 text-xs block mb-1">회로 전면 배선 사진</span>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3">
          <div class="aspect-[3/4] bg-slate-950 rounded-xl overflow-hidden relative mb-2 border border-slate-800">
            <img src="images/arduino-buzzer-switch.jpg" alt="피에조 버저 및 스위치" class="w-full h-full object-cover">
          </div>
          <span class="font-bold text-sky-400 text-xs block mb-1">버저 & 스위치 측면 사진</span>
        </div>
      </div>

      <!-- Conduit Wiring Practice Image -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 grid grid-cols-1 md:grid-cols-12 gap-6 items-center">
        <div class="md:col-span-5 lg:col-span-4">
          <div class="aspect-[3/4] bg-slate-950 rounded-xl overflow-hidden border border-slate-800">
            <img src="images/conduit-wiring-practice.jpg" alt="제어반 배관 및 배선 실습 완성 작품" class="w-full h-full object-cover">
          </div>
        </div>
      </div>
    </section>

    <!-- TAB 2: COVER LETTER -->
    <section id="tab-cover-letter" class="tab-content hidden space-y-8">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 flex flex-col md:flex-row items-center gap-6">
        <div class="flex items-center gap-4 shrink-0">
          <!-- 3D Avatar (.png) -->
          <div class="w-28 h-36 rounded-xl bg-slate-950 border-2 border-sky-500/40 overflow-hidden shadow-lg relative flex items-center justify-center">
            <img src="images/profile-3d.png" alt="3D 정장 아바타" class="w-full h-full object-cover object-top">
          </div>
          <!-- Studio Photo (.png) -->
          <div class="w-28 h-36 rounded-xl bg-slate-950 border-2 border-emerald-500/40 overflow-hidden shadow-lg relative flex items-center justify-center">
            <img src="images/profile-photo.png" alt="증명사진" class="w-full h-full object-cover object-top">
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- JAVASCRIPT -->
  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + tabId).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-sky-400', 'bg-sky-500/10', 'border', 'border-sky-500/30');
        btn.classList.add('text-slate-400', 'hover:text-white', 'hover:bg-slate-800/60');
      });
      const activeBtn = document.getElementById('nav-' + tabId);
      if(activeBtn) {
        activeBtn.classList.remove('text-slate-400', 'hover:text-white', 'hover:bg-slate-800/60');
        activeBtn.classList.add('text-sky-400', 'bg-sky-500/10', 'border', 'border-sky-500/30');
      }
    }
  </script>
</body>
</html>
